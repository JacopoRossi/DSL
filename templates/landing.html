<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSL Builder — Select Version</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 { font-size: 30px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 15px; }

        .start-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 50px 40px;
            flex-wrap: wrap;
        }

        .version-select {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .version-select label {
            font-size: 15px;
            font-weight: 600;
            color: #495057;
        }

        .version-select select {
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .version-select select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .start-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: all 0.25s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DSL Builder</h1>
            <p>Select the DSL version and start configuring</p>
        </div>

        <div class="start-row">
            <div class="version-select">
                <label for="version">Version</label>
                <select id="version">
                    <option value="/v1/" selected>Version A</option>
                    <option value="/v2/">Version B</option>
                </select>
            </div>
            <button class="start-btn" onclick="startConfiguring()">Start Configuring DSL</button>
        </div>
    </div>

    <script>
        function startConfiguring() {
            window.location.href = document.getElementById('version').value;
        }
    </script>
</body>
</html>
